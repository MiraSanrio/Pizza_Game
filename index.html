<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        
        <title>Slice Slice Baby</title>

        <!-- Link css to html -->
        <link rel="stylesheet" href="style.css">

        <!--Import Caveat Font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

        <!--Import Fredoka Font-->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@300..700&display=swap" rel="stylesheet">
    </head>

    <body>
        
        <div class="game-wrapper">
            <main class="splash-container">

                <!-- LEFT DESIGN -->
                <div class="left-cluster">
                    <img src="./Images/redheart.png" class="hearts-left" alt="hearts">
                    <img src="./Images/mainpizza-left.png" class="pizza-left" alt="pizza">
                </div>

                <!-- CENTER DESIGN -->
                <div class="center-cluster">
                    <h1 class="slice-baby">
                        <span class="pink-1">Slice Slice Baby</span>
                        <span class="pink-2">Slice Slice Baby</span>
                        <span class="pink-3">Slice Slice Baby</span>
                    </h1>
                    <a href="./Start/start.html" style="text-decoration: none;">
                    <button class="start-button">START</button>
                    </a>
                </div>

                <!-- RIGHT DESIGN -->
                <div class="right-cluster">
                    <img src="./Images/redheart.png" class="hearts-right" alt="hearts">
                    <img src="./Images/mainpizza-right.png" class="pizza-right" alt="pizza">
                </div>

                

            </main>
        </div>

        







        <script src="script.js"></script>
    </body>
</html>
